stages:
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/

test:
  stage: test
  image: openjdk:17-jdk-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.5/binaries/apache-maven-3.9.5-bin.tar.gz | tar xzf - -C /opt
    - export PATH=/opt/apache-maven-3.9.5/bin:$PATH
  script:
    - mvn test -Dspring.profiles.active=dev
  only:
    - main
    - merge_requests

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Deploying to Render..."
      response=$(curl -X POST \
        -H "Authorization: Bearer $RENDER_API_KEY" \
        -H "Content-Type: application/json" \
        -d '{
          "clearCache": true
        }' \
        "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
      
      echo "Deploy response: $response"
      
      deploy_id=$(echo $response | jq -r '.id')
      if [ "$deploy_id" = "null" ]; then
        echo "Failed to start deployment"
        exit 1
      fi
      
      echo "Deploy started with ID: $deploy_id"
      
      # Optional: Wait for deployment to complete
      echo "Waiting for deployment to complete..."
      while true; do
        status=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" | \
          jq -r '.status')
      
        echo "Current status: $status"
      
        if [ "$status" = "live" ]; then
          echo "Deployment completed successfully!"
          break
        elif [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ]; then
          echo "Deployment failed with status: $status"
          exit 1
        fi
      
        sleep 30
      done
  needs:
    - test
  only:
    - main
#  when: manual  # Remove this line if you want automatic deployment